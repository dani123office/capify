services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000
      - MAX_UPLOAD_MB=200
      - JOB_TTL_HOURS=24
    volumes:
      - backend-uploads:/app/uploads
      - backend-outputs:/app/outputs
      - backend-models:/app/models
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-uploads:
  backend-outputs:
  backend-models:
